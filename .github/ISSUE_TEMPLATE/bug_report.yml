name: Bug Report
description: Report a bug with the EcoFlow Modbus integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.
  - type: input
    id: ha-version
    attributes:
      label: Home Assistant Version
      placeholder: "e.g., 2025.5.0"
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration Version
      description: Found in manifest.json or HACS
      placeholder: "e.g., 1.2.0"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device Model
      options:
        - PowerOcean
        - STREAM 5000
        - Modbus Simulator
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Paste any relevant logs from Home Assistant
      render: text
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Your YAML config or setup details (remove sensitive info)
      render: yaml
